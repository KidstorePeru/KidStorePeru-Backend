# Conservative set of high-signal linters. Expand once the existing findings
# are triaged (see the "lint" job in .github/workflows/ci.yml).
run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - govet
    - ineffassign
    - unused
    - misspell
    - staticcheck
    - bodyclose

issues:
  exclude-rules:
    - path: _test\.go
      linters: [bodyclose]
